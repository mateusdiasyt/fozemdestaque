services:
  media-upload:
    build: .
    restart: unless-stopped
    environment:
      MEDIA_UPLOAD_TOKEN: ${MEDIA_UPLOAD_TOKEN}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL}
      UPLOAD_ROOT: /media
      MAX_UPLOAD_BYTES: 104857600
    expose:
      - "3000"
    volumes:
      - media-data:/media

volumes:
  media-data:
